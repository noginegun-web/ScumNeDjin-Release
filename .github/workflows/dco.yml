name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit sign-off
        shell: bash
        run: |
          set -euo pipefail
          # pull_request workflows check out a generated merge commit. Check
          # the contributor's real head SHA instead, otherwise the synthetic
          # merge commit itself can never carry a DCO sign-off.
          head="${{ github.event.pull_request.head.sha }}"
          base="$(git merge-base "origin/$GITHUB_BASE_REF" "$head")"
          while read -r commit; do
            git show -s --format=%B "$commit" | grep -qi '^Signed-off-by: '
          done < <(git rev-list "$base..$head")
