name: Quality

on:
  push:
    branches: ["community"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check ue4ss/ScumNeDjin/web/app.js

  native:
    # The native bridge requires the MSVC toolchain shipped on the 2022 image.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check public tree
        shell: pwsh
        run: ./scripts/Test-PublicTree.ps1
      - name: Configure native bridge
        run: cmake -S src/native -B build/native -G "Visual Studio 17 2022" -A x64 -DSCUM_NEDJIN_PUBLIC_REQUIRE_CONFIGURED_API_KEY=ON -DSCUM_NEDJIN_BUILD_TESTS=ON
      - name: Build native bridge
        run: cmake --build build/native --config Release
      - name: Run native safety tests
        run: ctest --test-dir build/native -C Release --output-on-failure
